[package]
name = "synthesis-engine"
version = "0.1.0"
description = "Synthesis Engine - Human Design & Numerology"
authors = ["Synthesis Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
thiserror = "1.0"

# Swiss Ephemeris integration
libswe-sys = "0.2"

# Cryptography for local storage
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.21"
keyring = "2"

# HTTP client for geocoding
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
urlencoding = "2.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
